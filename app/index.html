<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Đặt hàng vật tư</title>
<meta name="description" content="Đặt hàng, nhận hàng, kho và tài sản cho công trường">
<meta name="theme-color" content="#44502a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Vật tư">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <div class="topbar-in">
    <div class="brand">
      <img class="brand-logo" src="icons/logo.png" alt="Mekocons E&amp;C">
      <div><h1>Đặt hàng vật tư</h1><div class="sub" id="company"></div></div>
    </div>
    <div class="sync" id="sync"></div>
    <button class="btn primary" id="btn-update" data-act="update" title="Gửi đơn chờ, tải dữ liệu mới nhất (Shift+bấm: tải lại toàn bộ)">⟳ Update</button>
    <div class="user-chip" id="user-chip"></div>
    <div id="lang-slot" data-notr></div>
  </div>
  <nav class="tabs" id="tabs" role="tablist"></nav>
</header>
<div class="banner" id="banner"></div>
<main id="view"><div class="card empty">Đang tải…</div></main>
<div id="ac" role="listbox"></div>
<div id="toasts"></div>
<noscript><p style="padding:16px">Cần bật JavaScript để dùng ứng dụng.</p></noscript>

<!-- Thư viện Supabase (bản cố định) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script type="module" src="js/main.js"></script>
<!-- Trợ lý MekoCons: nút chat góc phải dưới (chỉ hiện khi đã đăng nhập) -->
<script type="module" src="js/chat-widget.js"></script>
</body>
</html>
